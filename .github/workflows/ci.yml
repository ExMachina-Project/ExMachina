# CI：仅在 PR 时编译 + 测试（不发布任何产物）
# dev / main 上的直接 push 不触发任何工作流——日常开发零消耗，验证关口前移到 PR
# 发版走 release.yml（仅 dev→main 合入触发：自动打 tag + 全平台构建 + 发 GitHub Release）
name: ci
on:
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # computer-use 栈(enigo/xcap)链接需要 libxdo;缺库时 cargo test 链接期即失败
      - name: System libs
        run: sudo apt-get update && sudo apt-get install -y libxdo-dev
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Check
        # --locked：Cargo.lock 与 Cargo.toml 漂移（改了依赖忘提交锁文件）在此机械拦截
        run: cargo check --workspace --locked
      # Lint 门禁：警告清零是基线纪律（一笔 56 条警告的欠账曾无人拦），新警告进 PR 即红
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace
      # 端到端验收（README 的验证入口）：REST 全端点 + 事件流 + 任务图 + 证据/三账/记忆/档案。
      # 它是 example，cargo test 不会跑 —— 曾长期无人执行而悄悄腐烂（编成目录迁移后 36 项飘红）。
      # 脚本自持：端点/档案/记忆开关都在进程内覆盖，不随仓库外的本机配置漂移；跑完还原被改动的文件。
      - name: E2E acceptance
        run: cargo run -p exm-gateway --example e2e

  webui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: webui/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      - name: Install & Build
        run: npm install && npm run build:webui
      # 取词函数的参数类型放宽了动态 key，拼错的静态 key 编译期抓不到；
      # 未收录的 key 会静默返回原文（界面直接显示 approvals.xxx）。此处兜底拦截。
      - name: i18n keys
        run: npm run check:i18n
