# CI：仅在 PR 时编译 + 测试（不发布任何产物）
# dev / main 上的直接 push 不触发任何工作流——日常开发零消耗，验证关口前移到 PR
# 发版走 release.yml（仅 dev→main 合入触发：自动打 tag + 全平台构建 + 发 GitHub Release）
name: ci
on:
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # computer-use 栈(enigo/xcap)链接需要 libxdo;缺库时 cargo test 链接期即失败
      - name: System libs
        run: sudo apt-get update && sudo apt-get install -y libxdo-dev
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Check
        # --locked：Cargo.lock 与 Cargo.toml 漂移（改了依赖忘提交锁文件）在此机械拦截
        run: cargo check --workspace --locked
      # Lint 门禁：警告清零是基线纪律（一笔 56 条警告的欠账曾无人拦），新警告进 PR 即红
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        env:
          EXM_OPENAPI_CONTRACT_EXCHANGES: ${{ runner.temp }}/openapi-exchanges.json
        run: cargo test --workspace --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: OpenAPI 3.1 contract and examples
        run: |
          python -m pip install -r scripts/requirements-openapi.txt
          cargo run -p exm-cli --bin exm --locked -- openapi --out "$RUNNER_TEMP/openapi.json"
          python scripts/check-openapi.py "$RUNNER_TEMP/openapi.json" --exchanges "$RUNNER_TEMP/openapi-exchanges.json"
      # 端到端验收（README 的验证入口）：REST 全端点 + 事件流 + 任务图 + 证据/三账/记忆/档案。
      # 它是 example，cargo test 不会跑 —— 曾长期无人执行而悄悄腐烂（编成目录迁移后 36 项飘红）。
      # 端点/档案/记忆开关在进程内覆盖；写入仅落在独立临时目录。
      - name: E2E acceptance
        run: cargo run -p exm-gateway --example e2e --locked

  webui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      - name: Install & Build
        run: npm ci && npm run build:webui
      - name: TypeScript scripts and desktop lint
        run: npm run check:scripts && npm run lint:desktop-ui
      # 取词函数的参数类型放宽了动态 key，拼错的静态 key 编译期抓不到；
      # 未收录的 key 会静默返回原文（界面直接显示 approvals.xxx）。此处兜底拦截。
      - name: i18n keys
        run: npm run check:i18n
      - name: Install Chromium for browser regressions
        run: npx playwright-core install --with-deps chromium
      - name: WebUI and desktop browser regressions
        run: npm run test:ui

  # Windows 编译门禁：release 流水线全平台出包，但本 CI 只有 ubuntu——
  # Windows 专属编译错误（Unix API 误用等）曾带病潜伏两个版本，发版时才在 release 里爆红。
  # 只跑 check（不跑 clippy/test）：目标是在 PR 阶段机械拦住「Windows 编不过」，不是全量质量门。
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Check
        run: cargo check --workspace --locked
