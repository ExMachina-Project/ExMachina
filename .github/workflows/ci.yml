# CI：仅在 PR 时编译 + 测试（不发布任何产物）
# dev / main 上的直接 push 不触发任何工作流——日常开发零消耗，验证关口前移到 PR
# 发版走 release.yml（仅 dev→main 合入触发：自动打 tag + 全平台构建 + 发 GitHub Release）
name: ci
on:
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # computer-use 栈(enigo/xcap)链接需要 libxdo;缺库时 cargo test 链接期即失败
      - name: System libs
        run: sudo apt-get update && sudo apt-get install -y libxdo-dev
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace

  webui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: webui/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      - name: Install & Build
        run: npm install && npm run build:webui
