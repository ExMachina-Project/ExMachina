# 发布流水线：仅 dev→main 合入（push main）触发，日常 dev 提交零触发
# 流程：读 Cargo.toml workspace 版本号 → 该版本 tag 不存在则：
#       全平台构建（服务端预编译包 + 桌面端安装包）→ 自动打 tag → 发 GitHub Release
# 版本号未 bump（tag 已存在）时全部跳过——「只是合入而不发版」是合法操作，不会重复发布
# 发版纪律：功能未经充分测试不要合入 main——合入即发布
# 移动端：待 tauri android/ios 工程初始化后，扩展 desktop job 的 matrix 即可
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - name: 读取版本号
        id: ver
        run: |
          VER=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "▸ 版本 v$VER"
      - name: 检查该版本是否已发布(自动追加后缀)
        id: check
        run: |
          TAG="${{ steps.check.outputs.tag }}"
          SUFFIX=0
          FINAL="$TAG"
          while git ls-remote --tags origin "refs/tags/$FINAL" | grep -q .; do
            SUFFIX=$((SUFFIX + 1))
            FINAL="$TAG.$SUFFIX"
          done
          echo "tag=$FINAL" >> "$GITHUB_OUTPUT"
          echo "▸ 发版 tag: $FINAL"

  # ── 服务端预编译包：exm-gateway / exm / exmachina + webui-dist + 文档 ──────────
  server:
    needs: version
    if: needs.version.outputs.exists == 'no'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: exmachina-windows-x64.zip
          - os: ubuntu-22.04
            artifact: exmachina-linux-x64.tar.gz
          - os: macos-14
            artifact: exmachina-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build WebUI
        run: npm install && npm run build:webui
      - name: Build binaries (release)
        run: cargo build --release -p exm-gateway -p exm-cli
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p bundle
          cp target/release/exm-gateway target/release/exm target/release/exmachina bundle/
          cp -r webui/dist bundle/webui-dist
          cp README.md bundle/
          cp -r docs bundle/docs
          tar -czf ${{ matrix.artifact }} -C bundle .
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory bundle | Out-Null
          Copy-Item target/release/exm-gateway.exe,target/release/exm.exe,target/release/exmachina.exe bundle/
          Copy-Item webui/dist bundle/webui-dist -Recurse
          Copy-Item README.md bundle/; Copy-Item docs bundle/docs -Recurse
          Compress-Archive -Path bundle/* -DestinationPath ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # ── 桌面端:纯原生 egui 应用(无 webview)+ 本地网关侧车 + 安装包 ──────────
  desktop:
    needs: version
    if: needs.version.outputs.exists == 'no'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: exmachina-desktop-linux-x64.tar.gz
          - os: windows-latest
            artifact: exmachina-desktop-windows-x64-setup.exe
          - os: macos-14
            artifact: exmachina-desktop-macos-arm64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxdo-dev
      - name: Install NSIS (windows installer)
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build WebUI (gateway-served advanced console)
        run: npm install && npm run build:webui
      - name: Build gateway sidecar
        run: cargo build --release -p exm-gateway
      - name: Build desktop app (native egui)
        run: cargo build --release --manifest-path desktop/Cargo.toml
      - name: Bundle + Package (unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/package-desktop.sh
          APP_BIN="desktop/target/release/exmachina-desktop"
          GW_BIN="target/release/exm-gateway"
          case "${{ matrix.os }}" in
            macos-14) ART="exmachina-desktop-macos-arm64.dmg" ;;
            *)        ART="exmachina-desktop-linux-x64.tar.gz" ;;
          esac
          scripts/package-desktop.sh bundle "$APP_BIN" "$GW_BIN" "$ART"
      - name: Bundle + Package (windows NSIS installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle\bin, bundle\resources\webui, bundle\resources\data-seed | Out-Null
          Copy-Item desktop\target\release\exmachina-desktop.exe bundle\
          Copy-Item target\release\exm-gateway.exe bundle\bin\
          Copy-Item icon.ico bundle\
          Copy-Item -Recurse -Force webui\dist bundle\resources\webui\dist
          Copy-Item -Recurse -Force entities bundle\resources\data-seed\entities
          Copy-Item -Recurse -Force skills bundle\resources\data-seed\skills
          Copy-Item default-soul.md bundle\resources\data-seed\default-soul.md
          Copy-Item installer\windows.iss .
          iscc windows.iss
          Copy-Item exmachina-desktop-windows-x64-setup.exe exmachina-desktop-windows-x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.artifact }}

  # ── 发布：打 tag + 汇总全平台产物发 GitHub Release ─────────────────────────────
  publish:
    needs: [version, server, desktop]
    if: github.ref == 'refs/heads/main' && needs.version.outputs.exists == 'no'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 展平产物
        run: |
          mkdir -p release
          find dist -type f -exec mv {} release/ \;
          ls -la release/
      - name: 打发布 tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.version.outputs.tag }}" -m "release ${{ needs.version.outputs.tag }}" "${{ github.sha }}"
          git push origin "${{ needs.version.outputs.tag }}"
      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: release/*
