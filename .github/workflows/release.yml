# 发布流水线：仅 dev→main 合入（push main）触发，日常 dev 提交零触发
# 流程：读 Cargo.toml workspace 版本号 → 该版本 tag 不存在则：
#       全平台构建（服务端预编译包 + 桌面端安装包）→ 自动打 tag → 发 GitHub Release
# 版本号未 bump（tag 已存在）时全部跳过——「只是合入而不发版」是合法操作，不会重复发布
# 发版纪律：功能未经充分测试不要合入 main——合入即发布
# 移动端：待 tauri android/ios 工程初始化后，扩展 desktop job 的 matrix 即可
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - name: 读取版本号
        id: ver
        run: |
          VER=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "▸ 版本 v$VER"
      - name: 检查该版本是否已发布(已发布则整条流水线跳过)
        id: check
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "exists=yes" >> "$GITHUB_OUTPUT"
            echo "▸ tag $TAG 已存在——版本号未 bump，跳过发版（合入不发版是合法操作）"
          else
            echo "exists=no" >> "$GITHUB_OUTPUT"
            echo "▸ 发版 tag: $TAG"
          fi

  # ── 服务端预编译包：exm-gateway / exm / exmachina + webui-dist + 文档 ──────────
  server:
    needs: version
    if: needs.version.outputs.exists == 'no'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: exmachina-windows-x64.zip
          - os: ubuntu-22.04
            artifact: exmachina-linux-x64.tar.gz
          - os: macos-14
            artifact: exmachina-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 工具链安装（重试，防 rustup CDN 抖动）
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            rustup toolchain install stable --profile minimal --no-self-update && break
            echo "第 $i/5 次失败，30s 后重试（rustup CDN 抖动）"; sleep 30
          done
      - uses: dtolnay/rust-toolchain@stable
      - name: System libs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build WebUI
        run: npm install && npm run build:webui
      - name: Build binaries (release)
        run: cargo build --release -p exm-gateway -p exm-cli
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p bundle
          cp target/release/exm-gateway target/release/exm target/release/exmachina bundle/
          cp -r webui/dist bundle/webui-dist
          cp README.md bundle/
          cp -r docs bundle/docs
          tar -czf ${{ matrix.artifact }} -C bundle .
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory bundle | Out-Null
          Copy-Item target/release/exm-gateway.exe,target/release/exm.exe,target/release/exmachina.exe bundle/
          Copy-Item webui/dist bundle/webui-dist -Recurse
          Copy-Item README.md bundle/; Copy-Item docs bundle/docs -Recurse
          Compress-Archive -Path bundle/* -DestinationPath ${{ matrix.artifact }}
      - name: 产物附加版本号
        shell: bash
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          for f in exmachina-*.zip exmachina-*.tar.gz; do
            [ -e "$f" ] || continue
            mv "$f" "${f%.*}-$TAG.${f##*.}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.artifact }}
          path: exmachina-*

  # ── 桌面端：tauri 壳(自带本地网关,单端口交付) ──────────────────────────────
  desktop:
    needs: version
    if: needs.version.outputs.exists == 'no'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: exmachina-desktop-windows-x64-setup.exe
          - os: ubuntu-22.04
            artifact: exmachina-desktop-linux-x64.AppImage
          - os: macos-14
            artifact: exmachina-desktop-macos-arm64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 工具链安装（重试，防 rustup CDN 抖动）
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            rustup toolchain install stable --profile minimal --no-self-update && break
            echo "第 $i/5 次失败，30s 后重试（rustup CDN 抖动）"; sleep 30
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装 Linux webkit 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev
      - name: Build exm-gateway (release，作为桌面端 sidecar)
        run: cargo build --release -p exm-gateway
      - name: 放置 sidecar
        if: runner.os != 'Windows'
        run: |
          mkdir -p desktop/src-tauri/binaries
          cp target/release/exm-gateway desktop/src-tauri/binaries/
      - name: 放置 sidecar (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          Copy-Item target/release/exm-gateway.exe desktop/src-tauri/binaries/
      - name: Tauri build
        run: cd desktop && npm install && npx tauri build
      - name: 归档安装包
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) cp desktop/src-tauri/target/release/bundle/nsis/*-setup.exe   "${{ matrix.artifact }}" ;;
            Linux)   cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage "${{ matrix.artifact }}" ;;
            macOS)   cp desktop/src-tauri/target/release/bundle/dmg/*.dmg           "${{ matrix.artifact }}" ;;
          esac
      - name: 产物附加版本号
        shell: bash
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          f="${{ matrix.artifact }}"
          mv "$f" "${f%.*}-$TAG.${f##*.}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: exmachina-*

  # ── 发布：打 tag + 汇总全平台产物发 GitHub Release ─────────────────────────────
  publish:
    needs: [version, server, desktop]
    if: github.ref == 'refs/heads/main' && needs.version.outputs.exists == 'no'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 只拉发布产物：docker job 会留下 buildx 的 <repo>~<repo>~<hash>.dockerbuild
      # 内部记录（0 MB、非 zip），无过滤下载会在解包它时重试耗尽导致整个 publish 失败。
      - name: 下载 server 产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: server-*
          merge-multiple: true
      - name: 下载 desktop 产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: desktop-*
          merge-multiple: true
      - name: 展平产物
        run: |
          mkdir -p release
          find dist -type f -exec mv {} release/ \;
          ls -la release/
      - name: 打发布 tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.version.outputs.tag }}" -m "release ${{ needs.version.outputs.tag }}" "${{ github.sha }}" || echo "tag 已存在，跳过创建"
          git push origin "refs/tags/${{ needs.version.outputs.tag }}" || echo "远端 tag 已存在，跳过推送（Release 将挂到既有 tag）"
      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: release/*

  # ── 容器镜像：发 ghcr（生产镜像部署的注册表通道）────────────────────────────
  # 镜像命名与 deploy/ 模板默认值一致：ghcr.io/exmachina-project/exmachina:latest
  # GIT_HASH 构建参数注入运行镜像 EXM_GIT_HASH——一键更新的 SHA 比对依赖它。
  # secrets 缺失（如 fork）时跳过推送，仅本地构建验证 Dockerfile 可用性。
  docker:
    needs: version
    if: needs.version.outputs.exists == 'no'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 读取版本号
        id: ver
        run: |
          VER=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # 镜像仓库名必须全小写——组织名含大写（ExMachina-Project）时直接拼接会被
          # docker 拒绝（invalid tag: repository name must be lowercase）
          echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: 判断推送条件（registry 可用才推）
        id: pushable
        run: |
          if [ -n "${{ secrets.REGISTRY_TOKEN }}" ] || [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "push=yes" >> "$GITHUB_OUTPUT"
          else
            echo "push=no" >> "$GITHUB_OUTPUT"
          fi
      - name: 登录 ghcr
        if: steps.pushable.outputs.push == 'yes'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.ver.outputs.owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.pushable.outputs.push == 'yes' }}
          build-args: |
            GIT_HASH=${{ steps.ver.outputs.sha }}
          tags: |
            ghcr.io/${{ steps.ver.outputs.owner }}/exmachina:latest
            ghcr.io/${{ steps.ver.outputs.owner }}/exmachina:${{ steps.ver.outputs.tag }}

  # ── 发版后补步：把 main 的 squash 发版提交 merge 回 dev，补回发版线祖先 ────────
  # 背景：main 为线性历史（squash 落地），PR 的原始提交永远不在 main 祖先里。
  # 不补血缘的话，下次 dev→main PR 会 diverged 无法比对——历史上这一步靠人肉
  # 「merge main 合入 dev」，v0.5.2 时漏做直接炸出 307 条提交的 PR。此 job 使其不可能被遗忘。
  post-release:
    needs: [version, publish]
    # 只在真正发过版时跑；workflow_dispatch 手动跑且 tag 已存在时也允许补（补救漏掉的场次）
    if: always() && needs.version.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: merge main 回 dev（只改图不改内容——squash 内容本就是 dev 树的时点快照）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge origin/main --no-ff -m "merge main 合入 dev——补回 ${{ needs.version.outputs.tag }} squash 发版祖先（发版流水线自动补步）"
      - name: 推送 dev
        run: git push origin dev
