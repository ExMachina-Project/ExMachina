[workspace]
resolver = "2"
members = ["crates/exm-core", "crates/exm-gateway", "crates/exm-cli"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "native-tls"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
axum = { version = "0.7", features = ["ws", "json", "multipart"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
# 工作者节点 / 平台适配器 WS 客户端（napcat 局域网纯 WS；qqbot 走 native-tls 的 wss）
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "native-tls"] }

# 低性能设备友好：LTO + 单元编译 + 符号剥离 → 更小的单文件二进制与更高运行吞吐
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
