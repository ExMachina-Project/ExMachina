[package]
name = "exmachina-desktop"
version = "1.0.0"
edition = "2021"
description = "EXMACHINA 桌面端:纯原生对话窗口 + 自带本地网关,无 webview"
authors = ["EXMACHINA"]

# 独立于主 workspace(桌面端与主仓发布节奏不同)
[workspace]

[dependencies]
eframe = "0.29"
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "2", features = ["json"] }
anyhow = "1"
tungstenite = { version = "0.24", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
