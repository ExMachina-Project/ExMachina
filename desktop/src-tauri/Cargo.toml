[package]
name = "exmachina-desktop"
version = "1.0.0"
edition = "2021"
description = "EXMACHINA 桌面端：自带本地网关（同 OpenCode 单端口交付），亦可直连远程网关"

# 独立于主 workspace（壳与网关的发布节奏不同；tauri CLI 亦按独立工程管理）
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
