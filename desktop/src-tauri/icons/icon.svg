<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- EXMACHINA 应用图标：中枢环 + 四向弧（智能体环绕中枢运转）
       几何口径（与 webui/public/icon.svg 同一套比例放大到 512）：
         四弧 r=150 / 线宽 30（线宽:半径 ≈ 0.2，对齐 icon.svg 的 7:38 = 0.184），跨 70°，
         缺口居中于正交轴（弧心 45/135/225/315）—— 四条弧的缺口必须正好落在上下左右；
         中枢环 r=78 / 线宽 22，外缘 89 与四弧内缘 135 之间留 46 的呼吸（一个弧宽以上）；
         弧的不透明度自右上起顺时针 0.95 → 0.35。
       两条历史坑，改这里时务必逐条复核：
       1) 第 3 条 path 的终点曾误写成 282.05 108.28（应为 229.95 108.28），
          该弧于是从 280° 一路画到 10°，把顶部的缺口整段糊掉 —— 图标只剩三个缺口。
          用 tools 里的缺口量测（沿 r=150 逐度采样）可一眼验出：正常必须是 4 处，
          中心角 0 / 90 / 180 / 270。
       2) 中枢环曾用 r=97 / 线宽 50，外缘 122 与四弧内缘 127 只差 5，两者粘成一整块。 -->
  <rect width="512" height="512" fill="#000000"/>
  <circle cx="256" cy="256" r="78" fill="none" stroke="#ffffff" stroke-width="22"/>
  <g fill="none" stroke="#ffffff" stroke-width="30">
    <path d="M 282.05 108.28 A 150 150 0 0 1 403.72 229.95" opacity="0.95"/>
    <path d="M 403.72 282.05 A 150 150 0 0 1 282.05 403.72" opacity="0.75"/>
    <path d="M 229.95 403.72 A 150 150 0 0 1 108.28 282.05" opacity="0.55"/>
    <path d="M 108.28 229.95 A 150 150 0 0 1 229.95 108.28" opacity="0.35"/>
  </g>
</svg>
