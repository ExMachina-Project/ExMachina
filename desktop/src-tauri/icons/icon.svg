<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- EXMACHINA 应用图标：中枢环 + 外观弧槽
       几何口径（与 desktop/ui/mark.js 完全同一套，400 画布 / 圆心 200,200）：
         全部线宽 = 24.5（线宽:半径 ≈ 0.186）
         中枢环 r = 56.5（内缘 44.25 / 外缘 68.75）
         外圈 8 个 45° 槽位，边界落在 22.5° + k·45°：
           0° / 180°        → 远弧 r = 131.5
           45/135/225/315°  → 近弧 r = 107
           90° / 270°       → 空槽（上下各一个缺口）
         远弧 − 近弧 = 24.5 = 一个线宽 → 近弧外缘与远弧内缘共线于 r = 119.25，
         相邻槽位在 22.5° 处共用径向切边，连成阶梯状的整块。
       改这里时先回 mark.js 改口径，再用 npx tauri icon 重新生成 .ico/.png，
       别在这个文件里单独调数值。 -->
  <rect width="400" height="400" fill="#000000"/>
  <circle cx="200" cy="200" r="56.5" fill="none" stroke="#ffffff" stroke-width="24.5"/>
  <g fill="none" stroke="#ffffff" stroke-width="24.5" stroke-linecap="butt">
    <path d="M 321.49 250.32 A 131.5 131.5 0 0 0 321.49 149.68"/>
    <path d="M 298.86 159.05 A 107.0 107.0 0 0 0 240.95 101.14"/>
    <path d="M 159.05 101.14 A 107.0 107.0 0 0 0 101.14 159.05"/>
    <path d="M 78.51 149.68 A 131.5 131.5 0 0 0 78.51 250.32"/>
    <path d="M 101.14 240.95 A 107.0 107.0 0 0 0 159.05 298.86"/>
    <path d="M 240.95 298.86 A 107.0 107.0 0 0 0 298.86 240.95"/>
  </g>
</svg>
