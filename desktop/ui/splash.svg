<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 启动动画源文件：外弧组旋转（连结运转）+ 中枢圆环呼吸（核心跳动）
       几何口径与 icons/icon.svg 一致：四弧 r=150 / 线宽 30（线宽:半径 ≈ 0.2），
       缺口正对上下左右；弧的不透明度自右上起顺时针 0.95 → 0.35；中枢环 r=78 / 线宽 22。 -->
  <rect width="512" height="512" fill="#000000"/>
  <style>
    .arcs { transform-origin: 256px 256px; animation: spin 2.8s linear infinite; }
    .core { transform-origin: 256px 256px; animation: pulse 2.8s ease-in-out infinite; }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  </style>
  <circle class="core" cx="256" cy="256" r="78" fill="none" stroke="#ffffff" stroke-width="22"/>
  <g class="arcs" fill="none" stroke="#ffffff" stroke-width="30">
    <path d="M 282.05 108.28 A 150 150 0 0 1 403.72 229.95" opacity="0.95"/>
    <path d="M 403.72 282.05 A 150 150 0 0 1 282.05 403.72" opacity="0.75"/>
    <path d="M 229.95 403.72 A 150 150 0 0 1 108.28 282.05" opacity="0.55"/>
    <path d="M 108.28 229.95 A 150 150 0 0 1 229.95 108.28" opacity="0.35"/>
  </g>
</svg>
