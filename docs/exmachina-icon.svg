<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d12"/>
      <stop offset="100%" stop-color="#0d1420"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="100%" stop-color="#2a8ccf"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="0" fill="url(#bg)"/>

  <!-- 外六边形 -->
  <polygon points="128,36 200,76 200,180 128,220 56,180 56,76"
           fill="none" stroke="#1f2733" stroke-width="4"/>

  <!-- 内六边形 -->
  <polygon points="128,60 176,88 176,168 128,196 80,168 80,88"
           fill="none" stroke="#2a3240" stroke-width="2" opacity="0.5"/>

  <!-- 中心菱形（指挥体） -->
  <g filter="url(#glow)">
    <polygon points="128,92 164,128 128,164 92,128" fill="url(#core)"/>
  </g>

  <!-- 三个子菱形 -->
  <polygon points="128,56 140,68 128,80 116,68" fill="#7ee787"/>
  <polygon points="176,116 188,128 176,140 164,128" fill="#7ee787"/>
  <polygon points="80,116 92,128 80,140 68,128" fill="#7ee787"/>

  <!-- 连线 -->
  <g stroke="#3a4a5c" stroke-width="2" opacity="0.6">
    <line x1="128" y1="88" x2="128" y2="78"/>
    <line x1="160" y1="128" x2="170" y2="128"/>
    <line x1="96" y1="128" x2="86" y2="128"/>
  </g>

  <!-- 底部品牌名 -->
  <text x="128" y="244" font-family="'SF Mono',monospace" font-size="14"
        font-weight="700" fill="#8b949e" text-anchor="middle" letter-spacing="2">
    EX·M
  </text>
</svg>
