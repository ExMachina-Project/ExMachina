<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c10"/>
      <stop offset="100%" stop-color="#0b1118"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5dd8ff"/>
      <stop offset="50%" stop-color="#3aa0d8"/>
      <stop offset="100%" stop-color="#2a7cb0"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ff0a4"/>
      <stop offset="100%" stop-color="#50c878"/>
    </linearGradient>
    <filter id="glowB">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowS">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" fill="url(#bg)"/>

  <g transform="translate(128,128)">
    <!-- 双层六边形 -->
    <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-72"
             fill="none" stroke="#1a2433" stroke-width="3"/>
    <polygon points="0,-65 56,-32 56,32 0,65 -56,32 -56,-65"
             fill="none" stroke="#141c28" stroke-width="1.2" opacity="0.6"/>

    <!-- 六条刻度 -->
    <g stroke="#2a3a4e" stroke-width="1.2">
      <line x1="0" y1="-72" x2="0" y2="-63"/>
      <line x1="54" y1="-31" x2="46" y2="-27"/>
      <line x1="54" y1="31" x2="46" y2="27"/>
      <line x1="0" y1="72" x2="0" y2="63"/>
      <line x1="-54" y1="31" x2="-46" y2="27"/>
      <line x1="-54" y1="-31" x2="-46" y2="-27"/>
    </g>

    <!-- 中层六边形（旋转） -->
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26"
             fill="none" stroke="#223044" stroke-width="1" opacity="0.6"
             transform="rotate(30)"/>

    <!-- 中心菱形核 -->
    <g filter="url(#glowB)">
      <polygon points="0,-24 24,0 0,24 -24,0" fill="url(#core)"/>
    </g>
    <polygon points="0,-12 12,0 0,12 -12,0" fill="#a8eaff" opacity="0.8"/>

    <!-- 三个子菱形 -->
    <g filter="url(#glowS)">
      <polygon points="0,-48 11,-37 0,-26 -11,-37" fill="url(#sub)"/>
      <polygon points="46,-8 57,3 46,14 35,3" fill="url(#sub)" opacity="0.85"/>
      <polygon points="-46,-8 -35,3 -46,14 -57,3" fill="url(#sub)" opacity="0.85"/>
    </g>

    <!-- 连接线 -->
    <g stroke="#3a5a78" stroke-width="1.5" opacity="0.7">
      <line x1="0" y1="-20" x2="0" y2="-32"/>
      <line x1="20" y1="0" x2="38" y2="0"/>
      <line x1="-20" y1="0" x2="-38" y2="0"/>
    </g>

    <!-- 四角刻度 -->
    <g fill="#2a4a60" opacity="0.5">
      <rect x="-66" y="-66" width="8" height="2"/>
      <rect x="-66" y="-66" width="2" height="8"/>
      <rect x="58" y="-66" width="8" height="2"/>
      <rect x="64" y="-66" width="2" height="8"/>
      <rect x="-66" y="64" width="8" height="2"/>
      <rect x="-66" y="56" width="2" height="8"/>
      <rect x="58" y="64" width="8" height="2"/>
      <rect x="64" y="56" width="2" height="8"/>
    </g>
  </g>

  <!-- 底部签名 -->
  <text x="128" y="248" font-family="'SF Mono',monospace" font-size="12"
        font-weight="700" fill="#5a6a7e" text-anchor="middle" letter-spacing="4">
    EX·M
  </text>

  <!-- 直角边框 -->
  <rect x="0.5" y="0.5" width="255" height="255" fill="none" stroke="#1a2433" stroke-width="1"/>
</svg>
