<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c10"/>
      <stop offset="50%" stop-color="#0b1118"/>
      <stop offset="100%" stop-color="#0a0f16"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5dd8ff"/>
      <stop offset="100%" stop-color="#2a7cb0"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ff0a4"/>
      <stop offset="100%" stop-color="#50c878"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#a0b4c8"/>
    </linearGradient>
    <linearGradient id="underline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="100%" stop-color="#7ee787" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glowBig">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSm">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowText">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="240" fill="url(#bg)"/>

  <!-- 微弱网格 -->
  <g stroke="#10161f" stroke-width="0.4" opacity="0.25">
    <line x1="0" y1="60" x2="960" y2="60"/>
    <line x1="0" y1="120" x2="960" y2="120"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="240" y1="0" x2="240" y2="240"/>
    <line x1="480" y1="0" x2="480" y2="240"/>
    <line x1="720" y1="0" x2="720" y2="240"/>
  </g>

  <!-- ============ 产品图标：精确六边形 ============ -->
  <!-- 六边形参数：flat-top，半径 r，中心 (cx,cy) -->
  <!-- 顶点：(cx-r, cy), (cx-r/2, cy-r√3/2), (cx+r/2, cy-r√3/2), (cx+r, cy), (cx+r/2, cy+r√3/2), (cx-r/2, cy+r√3/2) -->
  <g transform="translate(120,120)">
    <!-- 外六边形 r=68 -->
    <polygon points="-68,0 -34,-58.9 34,-58.9 68,0 34,58.9 -34,58.9"
             fill="none" stroke="#1a2433" stroke-width="2.5"/>
    <!-- 内描边六边形 r=63 -->
    <polygon points="-63,0 -31.5,-54.6 31.5,-54.6 63,0 31.5,54.6 -31.5,54.6"
             fill="none" stroke="#141c28" stroke-width="1" opacity="0.5"/>

    <!-- 刻度线：精确从外六边形顶点向内 -->
    <g stroke="#2a3a4e" stroke-width="1.2">
      <line x1="-68" y1="0" x2="-58" y2="0"/>
      <line x1="-34" y1="-58.9" x2="-29" y2="-50.2"/>
      <line x1="34" y1="-58.9" x2="29" y2="-50.2"/>
      <line x1="68" y1="0" x2="58" y2="0"/>
      <line x1="34" y1="58.9" x2="29" y2="50.2"/>
      <line x1="-34" y1="58.9" x2="-29" y2="50.2"/>
    </g>

    <!-- 中心菱形核 -->
    <g filter="url(#glowBig)">
      <polygon points="0,-22 22,0 0,22 -22,0" fill="url(#coreGrad)"/>
    </g>
    <polygon points="0,-10 10,0 0,10 -10,0" fill="#a8eaff" opacity="0.85"/>

    <!-- 三个子菱形：精确放在核的三个辐射方向 -->
    <!-- 上方子菱形：中心 (0,-36)，半径 8 -->
    <polygon points="0,-44 8,-36 0,-28 -8,-36" fill="url(#subGrad)" filter="url(#glowSm)"/>
    <!-- 右方子菱形：中心 (36,0)，半径 8 -->
    <polygon points="44,-8 52,0 44,8 36,0" fill="url(#subGrad)" filter="url(#glowSm)"/>
    <!-- 左方子菱形：中心 (-36,0)，半径 8 -->
    <polygon points="-36,-8 -28,0 -36,8 -44,0" fill="url(#subGrad)" filter="url(#glowSm)"/>

    <!-- 连接线：核顶点到子菱形底顶点 -->
    <g stroke="#3a5a78" stroke-width="1.5" opacity="0.7">
      <line x1="0" y1="-22" x2="0" y2="-28"/>
      <line x1="22" y1="0" x2="36" y2="0"/>
      <line x1="-22" y1="0" x2="-36" y2="0"/>
    </g>

    <!-- 四角 HUD 刻度 -->
    <g fill="#2a4a60" opacity="0.4">
      <rect x="-72" y="-72" width="10" height="2"/>
      <rect x="-72" y="-72" width="2" height="10"/>
      <rect x="62" y="-72" width="10" height="2"/>
      <rect x="70" y="-72" width="2" height="10"/>
      <rect x="-72" y="70" width="10" height="2"/>
      <rect x="-72" y="60" width="2" height="10"/>
      <rect x="62" y="70" width="10" height="2"/>
      <rect x="70" y="60" width="2" height="10"/>
    </g>
  </g>

  <!-- ============ 右侧：标题与介绍（居中） ============ -->
  <!-- 主标题 -->
  <text x="570" y="88"
        font-family="'SF Mono','Cascadia Code','Fira Code','JetBrains Mono',monospace"
        font-size="58" font-weight="800" fill="url(#textGrad)"
        text-anchor="middle" filter="url(#glowText)">
    EX·MACHINA
  </text>

  <!-- 副标题 -->
  <text x="570" y="122" font-family="'SF Mono','Cascadia Code',monospace"
        font-size="15" fill="#8b949e" letter-spacing="2" text-anchor="middle">
    ExMachina — 一个群体协作的智能集群
  </text>

  <!-- 渐变下划线 -->
  <rect x="330" y="138" width="480" height="2.5" fill="url(#underline)"/>

  <!-- 介绍文字 -->
  <text x="570" y="164" font-family="'SF Mono','Cascadia Code',monospace"
        font-size="12" fill="#5a6a7e" letter-spacing="0.5" text-anchor="middle">
    一个指挥体 · 一支可自由组建的智能体集群 · 目标进来，任务 DAG 出去
  </text>
  <text x="570" y="184" font-family="'SF Mono','Cascadia Code',monospace"
        font-size="12" fill="#5a6a7e" letter-spacing="0.5" text-anchor="middle">
    契约回流 · 冲突裁决 · 结论收束 · 零情绪 · 证据分级
  </text>

  <!-- 直角边框 -->
  <rect x="0.5" y="0.5" width="959" height="239" fill="none" stroke="#1a2433" stroke-width="1"/>

  <!-- 四角铆钉 -->
  <g fill="#1f2937">
    <rect x="8" y="8" width="10" height="10"/>
    <rect x="942" y="8" width="10" height="10"/>
    <rect x="8" y="222" width="10" height="10"/>
    <rect x="942" y="222" width="10" height="10"/>
  </g>
</svg>
