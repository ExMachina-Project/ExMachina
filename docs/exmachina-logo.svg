<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c10"/>
      <stop offset="50%" stop-color="#0b1118"/>
      <stop offset="100%" stop-color="#0a0f16"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5dd8ff"/>
      <stop offset="50%" stop-color="#3aa0d8"/>
      <stop offset="100%" stop-color="#2a7cb0"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ff0a4"/>
      <stop offset="100%" stop-color="#50c878"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#a0b4c8"/>
    </linearGradient>
    <linearGradient id="underline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="100%" stop-color="#7ee787" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glowBig">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSm">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowText">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="960" height="240" fill="url(#bg)"/>

  <!-- 微弱网格 -->
  <g stroke="#10161f" stroke-width="0.4" opacity="0.3">
    <line x1="0" y1="60" x2="960" y2="60"/>
    <line x1="0" y1="120" x2="960" y2="120"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="240" y1="0" x2="240" y2="240"/>
    <line x1="480" y1="0" x2="480" y2="240"/>
    <line x1="720" y1="0" x2="720" y2="240"/>
  </g>

  <!-- ============ 左侧：产品图标 ============ -->
  <g transform="translate(110,120)">
    <!-- 外六边形（双层） -->
    <polygon points="0,-66 57,-33 57,33 0,66 -57,33 -57,-33"
             fill="none" stroke="#1a2433" stroke-width="2.5"/>
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-60"
             fill="none" stroke="#141c28" stroke-width="1" opacity="0.6"/>

    <!-- 六条刻度线 -->
    <g stroke="#2a3a4e" stroke-width="1">
      <line x1="0" y1="-66" x2="0" y2="-57"/>
      <line x1="50" y1="-29" x2="43" y2="-24"/>
      <line x1="50" y1="29" x2="43" y2="24"/>
      <line x1="0" y1="66" x2="0" y2="57"/>
      <line x1="-50" y1="29" x2="-43" y2="24"/>
      <line x1="-50" y1="-29" x2="-43" y2="-24"/>
    </g>

    <!-- 中层六边形（旋转） -->
    <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-48"
             fill="none" stroke="#223044" stroke-width="1" opacity="0.5"
             transform="rotate(30)"/>

    <!-- 中心菱形核 -->
    <g filter="url(#glowBig)">
      <polygon points="0,-22 22,0 0,22 -22,0" fill="url(#coreGrad)"/>
    </g>
    <polygon points="0,-11 11,0 0,11 -11,0" fill="#a8eaff" opacity="0.8"/>

    <!-- 三个子菱形 -->
    <g filter="url(#glowSm)">
      <polygon points="0,-44 10,-34 0,-24 -10,-34" fill="url(#subGrad)"/>
      <polygon points="42,-7 52,3 42,13 32,3" fill="url(#subGrad)" opacity="0.85"/>
      <polygon points="-42,-7 -32,3 -42,13 -52,3" fill="url(#subGrad)" opacity="0.85"/>
    </g>

    <!-- 连接线（核顶点到子菱形顶点） -->
    <g stroke="#3a5a78" stroke-width="1.2" opacity="0.7">
      <line x1="0" y1="-22" x2="0" y2="-24"/>
      <line x1="22" y1="0" x2="32" y2="3"/>
      <line x1="-22" y1="0" x2="-32" y2="3"/>
    </g>

    <!-- 四角刻度 -->
    <g fill="#2a4a60" opacity="0.5">
      <rect x="-62" y="-62" width="8" height="2"/>
      <rect x="-62" y="-62" width="2" height="8"/>
      <rect x="54" y="-62" width="8" height="2"/>
      <rect x="60" y="-62" width="2" height="8"/>
      <rect x="-62" y="60" width="8" height="2"/>
      <rect x="-62" y="52" width="2" height="8"/>
      <rect x="54" y="60" width="8" height="2"/>
      <rect x="60" y="52" width="2" height="8"/>
    </g>
  </g>

  <!-- ============ 右侧：标题 + 介绍 ============ -->
  <!-- 主标题 -->
  <text x="210" y="100"
        font-family="'SF Mono','Cascadia Code','Fira Code','JetBrains Mono',monospace"
        font-size="56" font-weight="800" fill="url(#textGrad)"
        text-anchor="start" filter="url(#glowText)">
    EX·MACHINA
  </text>

  <!-- 渐变下划线 -->
  <rect x="212" y="114" width="480" height="3" fill="url(#underline)"/>

  <!-- 介绍文字（原 README 的两行） -->
  <text x="212" y="144" font-family="'SF Mono','Cascadia Code',monospace"
        font-size="14" fill="#8b949e" letter-spacing="1">
    以集体智能为核心的多智能体集群系统
  </text>
  <text x="212" y="166" font-family="'SF Mono','Cascadia Code',monospace"
        font-size="13" fill="#5a6a7e" letter-spacing="0.5">
    一个指挥体 · 一支可自由组建的智能体集群 · 目标进来，任务 DAG 出去
  </text>
  <text x="212" y="186" font-family="'SF Mono','Cascadia Code',monospace"
        font-size="13" fill="#5a6a7e" letter-spacing="0.5">
    契约回流 · 冲突裁决 · 结论收束 · 零情绪 · 证据分级
  </text>

  <!-- 直角边框 -->
  <rect x="0.5" y="0.5" width="959" height="239" fill="none" stroke="#1a2433" stroke-width="1"/>

  <!-- 四角铆钉 -->
  <g fill="#1f2937">
    <rect x="8" y="8" width="10" height="10"/>
    <rect x="942" y="8" width="10" height="10"/>
    <rect x="8" y="222" width="10" height="10"/>
    <rect x="942" y="222" width="10" height="10"/>
  </g>
</svg>
