<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="100%" stop-color="#7ee787"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="640" height="180" rx="12" fill="url(#bg)"/>

  <!-- 网格线 -->
  <g stroke="#1b2230" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="30" x2="640" y2="30"/>
    <line x1="0" y1="60" x2="640" y2="60"/>
    <line x1="0" y1="90" x2="640" y2="90"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="150" x2="640" y2="150"/>
    <line x1="80" y1="0" x2="80" y2="180"/>
    <line x1="160" y1="0" x2="160" y2="180"/>
    <line x1="240" y1="0" x2="240" y2="180"/>
    <line x1="320" y1="0" x2="320" y2="180"/>
    <line x1="400" y1="0" x2="400" y2="180"/>
    <line x1="480" y1="0" x2="480" y2="180"/>
    <line x1="560" y1="0" x2="560" y2="180"/>
  </g>

  <!-- 左侧 DAG（紧凑） -->
  <g filter="url(#glow)">
    <circle cx="38" cy="90" r="5" fill="#4cc9f0"/>
    <circle cx="68" cy="60" r="3.5" fill="#7ee787"/>
    <circle cx="68" cy="90" r="3.5" fill="#7ee787"/>
    <circle cx="68" cy="120" r="3.5" fill="#7ee787"/>
    <circle cx="96" cy="45" r="2.5" fill="#8b949e"/>
    <circle cx="96" cy="75" r="2.5" fill="#8b949e"/>
    <circle cx="96" cy="105" r="2.5" fill="#8b949e"/>
    <circle cx="96" cy="135" r="2.5" fill="#8b949e"/>
    <line x1="43" y1="90" x2="64" y2="60" stroke="#2a3240" stroke-width="1.2"/>
    <line x1="43" y1="90" x2="64" y2="90" stroke="#2a3240" stroke-width="1.2"/>
    <line x1="43" y1="90" x2="64" y2="120" stroke="#2a3240" stroke-width="1.2"/>
    <line x1="71" y1="60" x2="93" y2="45" stroke="#2a3240" stroke-width="1"/>
    <line x1="71" y1="60" x2="93" y2="75" stroke="#2a3240" stroke-width="1"/>
    <line x1="71" y1="90" x2="93" y2="75" stroke="#2a3240" stroke-width="1"/>
    <line x1="71" y1="90" x2="93" y2="105" stroke="#2a3240" stroke-width="1"/>
    <line x1="71" y1="120" x2="93" y2="105" stroke="#2a3240" stroke-width="1"/>
    <line x1="71" y1="120" x2="93" y2="135" stroke="#2a3240" stroke-width="1"/>
  </g>

  <!-- EXMACHINA 大字标（填满可用空间） -->
  <text x="115" y="88" font-family="'SF Mono','Cascadia Code','Fira Code',monospace"
        font-size="58" font-weight="700" fill="#e6edf3"
        letter-spacing="2" text-anchor="start" filter="url(#textGlow)">
    EX·MACHINA
  </text>

  <!-- 副标题 -->
  <text x="118" y="118" font-family="'SF Mono','Cascadia Code','Fira Code',monospace"
        font-size="13" fill="#8b949e" letter-spacing="3">
    智械体集群 // AGENT CLUSTER
  </text>

  <!-- 底部渐变条 -->
  <rect x="118" y="134" width="240" height="2.5" fill="url(#accent)" rx="1.25"/>

  <!-- 右上角状态灯 -->
  <circle cx="618" cy="22" r="3" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- 边框 -->
  <rect x="0.5" y="0.5" width="639" height="179" rx="12" fill="none" stroke="#1f2733" stroke-width="1"/>
</svg>
