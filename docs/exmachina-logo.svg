<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="100%" stop-color="#7ee787"/>
    </linearGradient>
  </defs>

  <!-- 背景：直角 -->
  <rect width="640" height="180" fill="url(#bg)"/>

  <!-- 网格线 -->
  <g stroke="#1b2230" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="30" x2="640" y2="30"/>
    <line x1="0" y1="60" x2="640" y2="60"/>
    <line x1="0" y1="90" x2="640" y2="90"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="150" x2="640" y2="150"/>
    <line x1="80" y1="0" x2="80" y2="180"/>
    <line x1="160" y1="0" x2="160" y2="180"/>
    <line x1="240" y1="0" x2="240" y2="180"/>
    <line x1="320" y1="0" x2="320" y2="180"/>
    <line x1="400" y1="0" x2="400" y2="180"/>
    <line x1="480" y1="0" x2="480" y2="180"/>
    <line x1="560" y1="0" x2="560" y2="180"/>
  </g>

  <!-- 左侧 DAG（等边直角菱形节点） -->
  <!-- 菱形：以(cx,cy)为中心，半径r，四点(cx,cy-r)(cx+r,cy)(cx,cy+r)(cx-r,cy) -->
  <g>
    <!-- 根节点（指挥体） -->
    <rect x="32" y="84" width="12" height="12" fill="#4cc9f0" transform="rotate(45 38 90)"/>
    <!-- 一级 -->
    <rect x="62" y="54" width="9" height="9" fill="#7ee787" transform="rotate(45 66.5 58.5)"/>
    <rect x="62" y="84" width="9" height="9" fill="#7ee787" transform="rotate(45 66.5 88.5)"/>
    <rect x="62" y="114" width="9" height="9" fill="#7ee787" transform="rotate(45 66.5 118.5)"/>
    <!-- 二级 -->
    <rect x="90" y="39" width="7" height="7" fill="#8b949e" transform="rotate(45 93.5 42.5)"/>
    <rect x="90" y="69" width="7" height="7" fill="#8b949e" transform="rotate(45 93.5 72.5)"/>
    <rect x="90" y="99" width="7" height="7" fill="#8b949e" transform="rotate(45 93.5 102.5)"/>
    <rect x="90" y="129" width="7" height="7" fill="#8b949e" transform="rotate(45 93.5 132.5)"/>
    <!-- 连线：直线直角折线 -->
    <polyline points="43,90 53,90 53,58 62,58" fill="none" stroke="#2a3240" stroke-width="1.5"/>
    <polyline points="43,90 62,90" fill="none" stroke="#2a3240" stroke-width="1.5"/>
    <polyline points="43,90 53,90 53,118 62,118" fill="none" stroke="#2a3240" stroke-width="1.5"/>
    <polyline points="71,58 80,58 80,42 90,42" fill="none" stroke="#2a3240" stroke-width="1"/>
    <polyline points="71,58 80,58 80,72 90,72" fill="none" stroke="#2a3240" stroke-width="1"/>
    <polyline points="71,90 90,90 90,72" fill="none" stroke="#2a3240" stroke-width="1"/>
    <polyline points="71,90 90,90 90,102" fill="none" stroke="#2a3240" stroke-width="1"/>
    <polyline points="71,118 80,118 80,102 90,102" fill="none" stroke="#2a3240" stroke-width="1"/>
    <polyline points="71,118 80,118 80,132 90,132" fill="none" stroke="#2a3240" stroke-width="1"/>
  </g>

  <!-- EXMACHINA 字标 -->
  <text x="112" y="88" font-family="'SF Mono','Cascadia Code','Fira Code',monospace"
        font-size="58" font-weight="700" fill="#e6edf3"
        letter-spacing="2" text-anchor="start">
    EX·MACHINA
  </text>

  <!-- 副标题 -->
  <text x="115" y="118" font-family="'SF Mono','Cascadia Code','Fira Code',monospace"
        font-size="13" fill="#8b949e" letter-spacing="3">
    智械体集群 // AGENT CLUSTER
  </text>

  <!-- 底部渐变条：直角 -->
  <rect x="115" y="134" width="240" height="3" fill="url(#accent)"/>

  <!-- 直角边框 -->
  <rect x="0.5" y="0.5" width="639" height="179" fill="none" stroke="#1f2733" stroke-width="1"/>
</svg>
