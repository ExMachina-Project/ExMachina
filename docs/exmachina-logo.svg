<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="100%" stop-color="#7ee787"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="640" height="180" rx="12" fill="url(#bg)"/>

  <!-- 网格线（工程图纸感） -->
  <g stroke="#1b2230" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="30" x2="640" y2="30"/>
    <line x1="0" y1="60" x2="640" y2="60"/>
    <line x1="0" y1="90" x2="640" y2="90"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="150" x2="640" y2="150"/>
    <line x1="80" y1="0" x2="80" y2="180"/>
    <line x1="160" y1="0" x2="160" y2="180"/>
    <line x1="240" y1="0" x2="240" y2="180"/>
    <line x1="320" y1="0" x2="320" y2="180"/>
    <line x1="400" y1="0" x2="400" y2="180"/>
    <line x1="480" y1="0" x2="480" y2="180"/>
    <line x1="560" y1="0" x2="560" y2="180"/>
  </g>

  <!-- 左侧 DAG 节点图 -->
  <g filter="url(#glow)">
    <!-- 根节点（指挥体） -->
    <circle cx="50" cy="90" r="6" fill="#4cc9f0"/>
    <!-- 一级子节点 -->
    <circle cx="90" cy="55" r="4" fill="#7ee787"/>
    <circle cx="90" cy="90" r="4" fill="#7ee787"/>
    <circle cx="90" cy="125" r="4" fill="#7ee787"/>
    <!-- 二级节点 -->
    <circle cx="125" cy="38" r="3" fill="#8b949e"/>
    <circle cx="125" cy="72" r="3" fill="#8b949e"/>
    <circle cx="125" cy="108" r="3" fill="#8b949e"/>
    <circle cx="125" cy="142" r="3" fill="#8b949e"/>
    <!-- 连线 -->
    <line x1="56" y1="90" x2="86" y2="55" stroke="#2a3240" stroke-width="1.2"/>
    <line x1="56" y1="90" x2="86" y2="90" stroke="#2a3240" stroke-width="1.2"/>
    <line x1="56" y1="90" x2="86" y2="125" stroke="#2a3240" stroke-width="1.2"/>
    <line x1="94" y1="55" x2="122" y2="38" stroke="#2a3240" stroke-width="1"/>
    <line x1="94" y1="55" x2="122" y2="72" stroke="#2a3240" stroke-width="1"/>
    <line x1="94" y1="90" x2="122" y2="72" stroke="#2a3240" stroke-width="1"/>
    <line x1="94" y1="90" x2="122" y2="108" stroke="#2a3240" stroke-width="1"/>
    <line x1="94" y1="125" x2="122" y2="108" stroke="#2a3240" stroke-width="1"/>
    <line x1="94" y1="125" x2="122" y2="142" stroke="#2a3240" stroke-width="1"/>
  </g>

  <!-- EXMACHINA 字标 -->
  <text x="170" y="95" font-family="'SF Mono','Cascadia Code','Fira Code',monospace"
        font-size="42" font-weight="700" fill="#e6edf3"
        letter-spacing="4" text-anchor="start">
    EX·MACHINA
  </text>

  <!-- 副标题 -->
  <text x="170" y="125" font-family="'SF Mono','Cascadia Code','Fira Code',monospace"
        font-size="11" fill="#8b949e" letter-spacing="2">
    智械体集群 // AGENT CLUSTER
  </text>

  <!-- 底部装饰线 -->
  <rect x="170" y="140" width="180" height="2" fill="url(#accent)" rx="1"/>

  <!-- 右上角状态灯 -->
  <circle cx="620" cy="20" r="3" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="612" y="24" font-family="monospace" font-size="8" fill="#3fb950" text-anchor="end">ONLINE</text>

  <!-- 边框 -->
  <rect x="0.5" y="0.5" width="639" height="179" rx="12" fill="none" stroke="#1f2733" stroke-width="1"/>
</svg>
