<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="100%" stop-color="#7ee787"/>
    </linearGradient>
  </defs>

  <!-- 背景：直角 -->
  <rect width="640" height="180" fill="url(#bg)"/>

  <!-- 网格线 -->
  <g stroke="#1b2230" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="30" x2="640" y2="30"/>
    <line x1="0" y1="60" x2="640" y2="60"/>
    <line x1="0" y1="90" x2="640" y2="90"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="150" x2="640" y2="150"/>
    <line x1="80" y1="0" x2="80" y2="180"/>
    <line x1="160" y1="0" x2="160" y2="180"/>
    <line x1="240" y1="0" x2="240" y2="180"/>
    <line x1="320" y1="0" x2="320" y2="180"/>
    <line x1="400" y1="0" x2="400" y2="180"/>
    <line x1="480" y1="0" x2="480" y2="180"/>
    <line x1="560" y1="0" x2="560" y2="180"/>
  </g>

  <!-- DAG：先画线，后画菱形（菱形盖在线上） -->
  <!-- 斜线连线 -->
  <g stroke="#2a3240" stroke-width="1.2">
    <line x1="44" y1="90" x2="62" y2="60"/>
    <line x1="44" y1="90" x2="62" y2="90"/>
    <line x1="44" y1="90" x2="62" y2="120"/>
    <line x1="73" y1="60" x2="90" y2="44"/>
    <line x1="73" y1="60" x2="90" y2="74"/>
    <line x1="73" y1="90" x2="90" y2="74"/>
    <line x1="73" y1="90" x2="90" y2="104"/>
    <line x1="73" y1="120" x2="90" y2="104"/>
    <line x1="73" y1="120" x2="90" y2="134"/>
  </g>

  <!-- 菱形节点（盖在线上方） -->
  <g>
    <!-- 根：大菱形 -->
    <polygon points="38,80 48,90 38,100 28,90" fill="#4cc9f0"/>
    <!-- 一级：中菱形 -->
    <polygon points="67,52 76,61 67,70 58,61" fill="#7ee787"/>
    <polygon points="67,82 76,91 67,100 58,91" fill="#7ee787"/>
    <polygon points="67,112 76,121 67,130 58,121" fill="#7ee787"/>
    <!-- 二级：小菱形 -->
    <polygon points="94,38 101,45 94,52 87,45" fill="#8b949e"/>
    <polygon points="94,68 101,75 94,82 87,75" fill="#8b949e"/>
    <polygon points="94,98 101,105 94,112 87,105" fill="#8b949e"/>
    <polygon points="94,128 101,135 94,142 87,135" fill="#8b949e"/>
  </g>

  <!-- EXMACHINA 字标 -->
  <text x="112" y="88" font-family="'SF Mono','Cascadia Code','Fira Code',monospace"
        font-size="58" font-weight="700" fill="#e6edf3"
        letter-spacing="2" text-anchor="start">
    EX·MACHINA
  </text>

  <!-- 副标题 -->
  <text x="115" y="118" font-family="'SF Mono','Cascadia Code','Fira Code',monospace"
        font-size="13" fill="#8b949e" letter-spacing="3">
    智械体集群 // AGENT CLUSTER
  </text>

  <!-- 底部渐变条：直角 -->
  <rect x="115" y="134" width="240" height="3" fill="url(#accent)"/>

  <!-- 直角边框 -->
  <rect x="0.5" y="0.5" width="639" height="179" fill="none" stroke="#1f2733" stroke-width="1"/>
</svg>
