<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d12"/>
      <stop offset="100%" stop-color="#0d1420"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="100%" stop-color="#7ee787"/>
    </linearGradient>
    <linearGradient id="nodeGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="100%" stop-color="#2a8ccf"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="640" height="200" fill="url(#bg)"/>

  <!-- 微弱网格 -->
  <g stroke="#141a26" stroke-width="0.4" opacity="0.4">
    <line x1="0" y1="40" x2="640" y2="40"/>
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="128" y1="0" x2="128" y2="200"/>
    <line x1="256" y1="0" x2="256" y2="200"/>
    <line x1="384" y1="0" x2="384" y2="200"/>
    <line x1="512" y1="0" x2="512" y2="200"/>
  </g>

  <!-- 左侧产品图标：六边形晶格 + 中心菱形 -->
  <g transform="translate(90,100)">
    <!-- 外六边形 -->
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26"
             fill="none" stroke="#1f2733" stroke-width="2"/>
    <!-- 内六边形（旋转30°） -->
    <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19"
             fill="none" stroke="#2a3240" stroke-width="1" opacity="0.6"/>
    <!-- 三个辐射菱形（指挥体 → 子个体） -->
    <g filter="url(#softGlow)">
      <polygon points="0,-14 14,0 0,14 -14,0" fill="url(#nodeGlow)"/>
      <polygon points="0,-32 8,-24 0,-16 -8,-24" fill="#7ee787" opacity="0.9"/>
      <polygon points="28,0 36,8 28,16 20,8" fill="#7ee787" opacity="0.7"/>
      <polygon points="-28,0 -20,8 -28,16 -36,8" fill="#7ee787" opacity="0.7"/>
    </g>
    <!-- 辐射线 -->
    <g stroke="#3a4a5c" stroke-width="1" opacity="0.5">
      <line x1="0" y1="-12" x2="0" y2="-20"/>
      <line x1="12" y1="0" x2="24" y2="0"/>
      <line x1="-12" y1="0" x2="-24" y2="0"/>
    </g>
  </g>

  <!-- 品牌名：大字标 -->
  <text x="180" y="105"
        font-family="'SF Mono','Cascadia Code','Fira Code',monospace"
        font-size="68" font-weight="800" fill="#e6edf3"
        letter-spacing="1" text-anchor="start">
    EXMACHINA
  </text>

  <!-- 品牌名下划线 -->
  <rect x="182" y="120" width="420" height="2" fill="url(#accent)"/>

  <!-- 副标题 -->
  <text x="182" y="148" font-family="'SF Mono','Cascadia Code','Fira Code',monospace"
        font-size="12" fill="#8b949e" letter-spacing="4">
    智械体集群 · AGENT CLUSTER
  </text>

  <!-- 直角边框 -->
  <rect x="0.5" y="0.5" width="639" height="199" fill="none" stroke="#1f2733" stroke-width="1"/>
</svg>
