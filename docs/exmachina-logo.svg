<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c10"/>
      <stop offset="100%" stop-color="#0d1420"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#a0b4c8"/>
    </linearGradient>
    <linearGradient id="underline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="100%" stop-color="#7ee787" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glowText">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="280" fill="url(#bg)"/>

  <!-- 微弱网格 -->
  <g stroke="#10161f" stroke-width="0.4" opacity="0.2">
    <line x1="0" y1="70" x2="960" y2="70"/>
    <line x1="0" y1="140" x2="960" y2="140"/>
    <line x1="0" y1="210" x2="960" y2="210"/>
    <line x1="240" y1="0" x2="240" y2="280"/>
    <line x1="480" y1="0" x2="480" y2="280"/>
    <line x1="720" y1="0" x2="720" y2="280"/>
  </g>

  <!-- 主标题：100px，上方间距 y=110 -->
  <text x="480" y="110"
        font-family="'SF Mono','Cascadia Code','Fira Code','JetBrains Mono',monospace"
        font-size="100" font-weight="800" fill="url(#textGrad)"
        text-anchor="middle" filter="url(#glowText)">
    EX·MACHINA
  </text>

  <!-- 副标题：22px，亮色 -->
  <text x="480" y="152" font-family="'SF Mono','Cascadia Code',monospace"
        font-size="22" font-weight="600" fill="#a8b8c8" letter-spacing="2" text-anchor="middle">
    智械体集群 // AGENT CLUSTER
  </text>

  <!-- 渐变下划线 -->
  <rect x="120" y="170" width="720" height="3" fill="url(#underline)"/>

  <!-- 介绍文字：18px，亮色 -->
  <text x="480" y="204" font-family="'SF Mono','Cascadia Code',monospace"
        font-size="18" fill="#8a9aae" letter-spacing="1" text-anchor="middle">
    一个指挥体 · 一支可自由组建的智能体集群 · 目标进来，任务 DAG 出去
  </text>
  <text x="480" y="234" font-family="'SF Mono','Cascadia Code',monospace"
        font-size="18" fill="#8a9aae" letter-spacing="1" text-anchor="middle">
    契约回流 · 冲突裁决 · 结论收束 · 零情绪 · 证据分级
  </text>

  <!-- 直角边框 -->
  <rect x="0.5" y="0.5" width="959" height="279" fill="none" stroke="#1a2433" stroke-width="1"/>

  <!-- 四角铆钉 -->
  <g fill="#1f2937">
    <rect x="8" y="8" width="12" height="12"/>
    <rect x="940" y="8" width="12" height="12"/>
    <rect x="8" y="260" width="12" height="12"/>
    <rect x="940" y="260" width="12" height="12"/>
  </g>
</svg>
