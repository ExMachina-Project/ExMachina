<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 566" width="1080" height="566"
     role="img" aria-labelledby="exmTitle exmDesc" class="exm-logo">
  <title id="exmTitle">EXMACHINA</title>
  <desc id="exmDesc">徽记逐段描出，字标自左向右揭示。</desc>

  <!--
    EXMACHINA 动态徽标（自包含：无外部字体/图片/脚本）
    · 用法：<img src="logo-exmachina.svg" width="480" alt="EXMACHINA">
            或把本文件内容整段内联进 HTML（内联后可用 CSS 变量改色）
    · 配色：全部走 currentColor。浅底用 color:#0b0d10，深底用 color:#e9e9ee
    · 节奏：改下面 @keyframes 的 animation 时间即可；整段约 2.2s，之后静止
    · 减速偏好：系统开启"减少动态效果"时直接呈现终态
  -->

  <style>
    /* 不写死颜色：全部走 currentColor。内联时继承页面文字色；
       作为图片引用时取初始值（黑），适合浅底；深底请内联并设 color。 */
    .exm-draw {
      stroke: currentColor;
      fill: none;
      stroke-linecap: butt;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: exmDraw 0.8s cubic-bezier(.22,1,.36,1) forwards;
    }
    /* 圆环用 100.6 的虚线段长：比路径长 0.6，首尾重叠，避免闭合处出现发丝缝 */
    .exm-ring { stroke-width: 24.5; animation-delay: 0.05s; stroke-dasharray: 100.6; stroke-dashoffset: 100.6; }
    .exm-arc  { stroke-width: 24.5; }


    .exm-wm-clip { animation: exmWipe 1.1s cubic-bezier(.65,0,.35,1) 1.05s forwards; clip-path: inset(-2% 100% -2% 0); }
    .exm-wm { fill: currentColor; }

    .exm-tag {
      fill: currentColor; opacity: 0;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 26px; font-weight: 400; letter-spacing: .01em;
      animation: exmTagIn 0.7s cubic-bezier(.22,1,.36,1) 2.45s forwards;
    }


    @keyframes exmDraw   { to { stroke-dashoffset: 0; } }
    @keyframes exmWipe   { to { clip-path: inset(-2% 0% -2% 0); } }
    @keyframes exmTagIn  { from { opacity: 0; } to { opacity: .82; } }


    @media (prefers-reduced-motion: reduce) {
      .exm-draw { animation: none; stroke-dashoffset: 0; }
      .exm-wm-clip { animation: none; clip-path: none; }
      .exm-tag { animation: none; opacity: .82; }

    }
  </style>

