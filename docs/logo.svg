<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="EXMACHINA">
  <!-- EXMACHINA 徽记 · 浅色主题版（白底 + 近黑描边）；深色主题见 logo-dark.svg。
       ⚠ 几何唯一定义在 desktop/ui/mark.js（400 画布 / 圆心 200,200），本文件是它的静态镜像。
         改比值请先改 mark.js，再同步本文件与 logo-dark.svg，勿在此单独调数值。
       口径：全部线宽 24.5 · 中枢环 r=56.5 · 远弧 r=131.5（0°/180°）· 近弧 r=107（45/135/225/315°）
             · 90°/270° 为空槽（只有上下两个缺口，2 次对称）· 线端 butt · 无渐变（零渐变纪律）
       底板 #ffffff 与 GitHub 浅色画布同色 ⇒ 主题匹配时完全隐形。为什么要有底板：
       `prefers-color-scheme` 跟的是**操作系统的深浅**、不是 GitHub 的主题，两者错配时会
       取到另一套描边色 —— 透明底就会白字压白底「看不清」。加同色底板后错配时成形为一张
       圆角卡片，任何底色上都看得清。 -->
  <rect width="400" height="400" rx="52" fill="#ffffff"/>
  <circle cx="200" cy="200" r="56.5" fill="none" stroke="#0b0d10" stroke-width="24.5"/>
  <g fill="none" stroke="#0b0d10" stroke-width="24.5" stroke-linecap="butt">
    <path d="M 321.49 250.32 A 131.5 131.5 0 0 0 321.49 149.68"/>
    <path d="M 298.86 159.05 A 107.0 107.0 0 0 0 240.95 101.14"/>
    <path d="M 159.05 101.14 A 107.0 107.0 0 0 0 101.14 159.05"/>
    <path d="M 78.51 149.68 A 131.5 131.5 0 0 0 78.51 250.32"/>
    <path d="M 101.14 240.95 A 107.0 107.0 0 0 0 159.05 298.86"/>
    <path d="M 240.95 298.86 A 107.0 107.0 0 0 0 298.86 240.95"/>
  </g>
</svg>
